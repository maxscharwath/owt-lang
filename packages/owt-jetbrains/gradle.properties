# --- Plugin coordinates --------------------------------------------------------
pluginGroup = dev.owt.ide
pluginName = OWT
pluginRepositoryUrl = https://github.com/maxscharwath/owt-lang
pluginVersion = 0.1.0

# --- IntelliJ Platform ----------------------------------------------------------
# Lowest supported build: 2025.2 (252). The LSP integration additionally needs 2025.2.1+
# (it is wired through the optional `com.intellij.modules.lsp` dependency).
pluginSinceBuild = 252
# IDE used to compile against / run with `./gradlew runIde`.
# IntelliJ IDEA is a single unified distribution since 2025.3 (`intellijIdea(...)`).
platformVersion = 2026.2.3
# Oldest IDE checked by `./gradlew testOldestPlatform` (and `verifyPlugin -PverifyIdeVersions=...`).
oldestPlatformVersion = 2025.2.6.3

# --- Gradle ---------------------------------------------------------------------
org.gradle.jvmargs = -Xmx3g -Dfile.encoding=UTF-8
org.gradle.configuration-cache = true
org.gradle.caching = true

# The IDE bundles the Kotlin stdlib, do not ship another copy.
kotlin.stdlib.default.dependency = false
